<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | Naver</title>
    <link rel="stylesheet" href="./styles/login.css" />
  </head>
  <body>
    <h1 class="sr-only">네이버 로그인 페이지</h1>

    <div class="login">
      <header>
        <h2 class="logo">
          <a href="https://www.naver.com" tabindex="-1">
            <img src="./../assets/login/naver-logo.svg" alt="네이버 로고 이미지" />
          </a>
        </h2>
      </header>
      <main>
        <form action="/" class="login-form">
          <div class="email">
            <label for="user-email" class="sr-only email__label"></label>
            <input
              type="email"
              id="user-email"
              class="login-form__input"
              name="email"
              placeholder="아이디(이메일)"
              required
            />
            <span class="invalid-email">아이디는 이메일 형식으로 입력해 주세요.</span>
          </div>
          <div class="password">
            <label for="user-password" class="sr-only password__label"></label>
            <input
              type="password"
              id="user-password"
              class="login-form__input"
              name="password"
              minlength="10"
              placeholder="비밀번호"
              required
            />
            <span class="invalid-password">비밀번호는 10자리 이상 입력해 주세요.</span>
          </div>
          <button type="submit" class="login-button" tabindex="-1">로그인</button>
          <div class="options">
            <div class="keep-loggedIn">
              <label class="keep-loggedIn__label">
                <input type="checkbox" />
                <span class="keep-loggedIn__checkbox" tabindex="0"></span>
              </label>
              <strong class="keep-loggedIn__text">로그인 상태유지</strong>
            </div>
            <div class="ip-security">
              <label>
                <a
                  href="./pages/ip_security.html"
                  target="_blank"
                  class="ip-security__popup"
                  tabindex="-1"
                >
                  <strong>IP 보안</strong>
                </a>
                <input type="checkbox" />
                <span class="ip-security__switch" tabindex="0"></span>
              </label>
            </div>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
